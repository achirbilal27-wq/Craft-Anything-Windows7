name: Windows 7 x64 compatibility build

on:
  push:
    branches:
      - feature/windows7-x64
    paths:
      - ".github/workflows/windows-7-x64.yml"
      - "apps/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/windows/portable.txt"
  pull_request:
    paths:
      - ".github/workflows/windows-7-x64.yml"
      - "apps/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/windows/portable.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-7-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows 7 x64 binaries
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install nightly Rust and Win7 standard-library sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Verify Win7 target and toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc --version
          cargo --version
          $target = rustc --print target-list | Where-Object { $_ -eq "x86_64-win7-windows-msvc" }
          if (-not $target) {
            throw "This nightly compiler does not expose x86_64-win7-windows-msvc."
          }
          Write-Host "Win7 target available: $target"

      - name: Build GUI and CLI for Windows 7
        shell: pwsh
        run: cargo -Z build-std=std,panic_unwind build --locked --release --target x86_64-win7-windows-msvc --package craft-anything --package craft-anything-cli
        env:
          CRAFT_ANYTHING_REQUIRE_WINRES: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Stage portable binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist/Craft-Anything-Windows7-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/x86_64-win7-windows-msvc/release/craft-anything.exe" $dist
          Copy-Item "target/x86_64-win7-windows-msvc/release/craft-anything-cli.exe" $dist
          Copy-Item "packaging/windows/portable.txt" $dist

      - name: Redirect legacy COM imports to ole32.dll
        shell: pwsh
        run: |
          .\scripts\patch-win7-com-imports.ps1 -BinaryPath @(
            "dist/Craft-Anything-Windows7-x64/craft-anything.exe",
            "dist/Craft-Anything-Windows7-x64/craft-anything-cli.exe"
          )

      - name: Audit Windows 7 import compatibility
        shell: pwsh
        run: |
          .\scripts\audit-windows7-imports.ps1 -BinaryPath @(
            "dist/Craft-Anything-Windows7-x64/craft-anything.exe",
            "dist/Craft-Anything-Windows7-x64/craft-anything-cli.exe"
          )

      - name: Package portable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/Craft-Anything-Windows7-x64/*" -DestinationPath "dist/Craft-Anything-Windows7-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Craft-Anything-Windows7-x64
          path: dist/Craft-Anything-Windows7-x64.zip
          if-no-files-found: error
          retention-days: 14
